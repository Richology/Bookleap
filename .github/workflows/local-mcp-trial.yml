name: Build and verify WebView sync assistant
on:
  workflow_dispatch:
  push:
    branches: [verify/webview-assistant]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: local-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local-mcp/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            local-mcp/src-tauri/target/release/build
            local-mcp/src-tauri/target/release/deps
            local-mcp/src-tauri/target/release/.fingerprint
          key: cargo-${{ runner.os }}-${{ hashFiles('local-mcp/src-tauri/Cargo.toml', 'local-mcp/src-tauri/Cargo.lock') }}
      - run: rustup default stable
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/package-webview.mjs
      - name: Install Mac DMG and start the WebView
        if: runner.os == 'macOS'
        run: |
          set -eu
          mount="$RUNNER_TEMP/mount"
          app="$RUNNER_TEMP/书跃本地同步助手.app"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist-trial/*-mac-arm64.dmg
          ditto "$mount/书跃本地同步助手.app" "$app"
          hdiutil detach "$mount"
          codesign --verify --strict --deep "$app"
          node test/webview-runtime-smoke.mjs "$app/Contents/Resources/runtime"
          mkdir -p "$RUNNER_TEMP/library"
          open -n "$app" --env BOOKLEAP_TEST_HOME="$RUNNER_TEMP/library" --args --bookleap-test
          for i in {1..30}; do test -f "$RUNNER_TEMP/library/app/settings.json" && break; sleep 1; done
          test -f "$RUNNER_TEMP/library/app/settings.json"
          curl -fsS -X OPTIONS -H 'Origin: https://www.bookleap.cn' http://127.0.0.1:48724/pair
          sleep 3
          screencapture -x "$RUNNER_TEMP/webview.png"
      - name: Install Windows EXE and close the window to the tray
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-trial/*-win-x64.exe).FullName
          $dir = "$env:RUNNER_TEMP\BookLeap Installed"
          $install = Start-Process $installer -ArgumentList "/S /D=$dir" -PassThru -Wait
          if ($install.ExitCode -ne 0) {throw "Installer failed"}
          node test/webview-runtime-smoke.mjs "$dir/runtime"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $env:BOOKLEAP_TEST_HOME = (New-Item -Type Directory (Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid()))).FullName
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=48725'
          $p = Start-Process "$dir/bookleap-sync.exe" -ArgumentList '--bookleap-test' -PassThru
          for ($i=0; $i -lt 45; $i++) {
            $p.Refresh()
            if ($p.HasExited) {throw "WebView host exited"}
            if ($p.MainWindowHandle -ne 0 -and (Test-Path "$env:BOOKLEAP_TEST_HOME/app/settings.json")) {break}
            Start-Sleep 1
          }
          if (!(Test-Path "$env:BOOKLEAP_TEST_HOME/app/settings.json")) {
            if (Test-Path "$env:BOOKLEAP_TEST_HOME/service-startup.log") {Get-Content "$env:BOOKLEAP_TEST_HOME/service-startup.log"}
            Get-Process -Id $p.Id | Select-Object ProcessName,MainWindowTitle
            throw "Installed WebView did not initialize its isolated library"
          }
          node test/webview-window-smoke.mjs
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $mainHwnd = $p.MainWindowHandle
          Add-Type -Name NativeWindow -Namespace BookLeapTest -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr hwnd);'
          if (!$p.CloseMainWindow()) {throw "Expected a real desktop window"}
          Start-Sleep 2
          $p.Refresh()
          if ($p.HasExited -or [BookLeapTest.NativeWindow]::IsWindowVisible($mainHwnd)) {throw "Close did not hide the assistant"}
          curl.exe --fail -X OPTIONS -H 'Origin: https://www.bookleap.cn' http://127.0.0.1:48724/pair
          if ($LASTEXITCODE -ne 0) {throw "Background sync is unavailable"}
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bookleap-webview-${{ runner.os }}
          path: |
            local-mcp/dist-trial/*-mac-arm64.dmg
            local-mcp/dist-trial/*-win-x64.exe
            ${{ runner.temp }}/webview.png
            local-mcp/src-tauri/Cargo.lock
          if-no-files-found: error
